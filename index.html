<!DOCTYPE html>
<html lang="en">
<head>
    <!-- got this dev tool from a friend because my school blocks inspect -->
    <script src="https://unpkg.com/eruda"></script>
<script>eruda.init();</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0 user-scalable=no">
    <title>Click the Pizza!</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <!-- main ui stuff -->
    <div id="main-ui">
    <h1>Click the Pizza!</h1>
    <div id="pizzaStuff">
        <div id="popup-Stack"></div>
        <img id="pizza" src=images/pizza/pizza8.png>
        <img id="target" src=images/combo.png style="display:none;">
    </div>
<h2>Pizzas: <span id="score">0</span></h2>
<!-- lock, combo , and multi text -->
<div class="comboArea"> 
<img id="lockCombo"src="images/unlock.png"style="display:none;" />
<div id="comboText" style="display:none;">
 Combo: <span id="combo" >0</span>x (Multiplier: <span id="multiplier">1</span>x)
 </div>
 </div>
</div>
<!-- upgrade tab -->
 <div id="upgrade-tab">
<img id="notepad-closed" class="notepad" src="images/upgrade/notepad_closed.png">
<!-- open notpad stuff -->
<div id="notepad-open-container" style="display:none;">
    <img id="notepad-open" class="notepad" src="images/upgrade/notepad_open.png">
    <div id="upgrade-info" style="display: none;">
Hover an upgrade for more info!
    </div>
    <div id="upgrade-grid"></div>
     </div>
    <!-- temporary button until i draw it -->
     <button id="closeNotepadButton">X</button>

</div>

<!-- in order to use import and export (type="module") -->
    <script type="module" src="scripts/main.js"></script>
</body>
</html>
